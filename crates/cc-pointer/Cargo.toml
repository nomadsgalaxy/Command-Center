[package]
name = "cc-pointer"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
authors.workspace = true
description = "cc_pointer, the SteamVR driver behind the mouse's laser: an invisible controller cc-panels aims (docs/laser-pointer-design.md)"

[lib]
# SteamVR loads bin/linuxarm64/driver_<manifest name>.so; build.sh copies libdriver_cc_pointer.so there.
name = "driver_cc_pointer"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
