[package]
name = "cc-home"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
authors.workspace = true
description = "Command Center's cc-home: spots, workspaces, machines, pairing, networks, hibernate, and the camera's align (cc-scan). Static musl: it runs on the Frame's host and in cc-box"

[dependencies]
cc-proto = { path = "../cc-proto" }
cc-scan = { path = "../cc-scan" }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
