[package]
name = "cc-install"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
authors.workspace = true
description = "Command Center's installer: a terminal app that installs, updates or removes it on the Steam Frame or a host. Static musl, from the GitHub release"

[dependencies]
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
