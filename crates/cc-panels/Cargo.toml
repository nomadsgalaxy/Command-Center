[package]
name = "cc-panels"
version = "0.2.0"
description = "Command Center's VR panels: every remote monitor as a SteamVR overlay, one pointer and keyboard across them, one clipboard"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
openvr-sys = { path = "../openvr-sys" }
freerdp-sys = { path = "../freerdp-sys" }
vncclient-sys = { path = "../vncclient-sys" } # VNC panels (vnc.rs), libvncclient built static
cc-proto = { path = "../cc-proto" } # the agent and pairing, in Rust (no cc-home run)
base64.workspace = true # a pairing's host key, as trusted-hosts keeps it
libc.workspace = true
fontdue.workspace = true # the border tags and glyphs (assets.rs), as cc-host draws its tag screens
serde_json.workspace = true
pipewire = { version = "0.9", features = ["v0_3_77"] }
wayland-client.workspace = true
wayland-scanner = "0.31"
wayland-backend = "0.3" # the generated interfaces name it
zbus.workspace = true
async-io = "2" # the long poll's timer (zbus runs on it already)
event-listener = "5" # the long poll's wake-up (zbus has it already)

[lints]
workspace = true
